<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Моё Приложение</title>
    
    <!-- Команды для iOS, чтобы скрыть браузер -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Моё PWA">
    
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f2f2f7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        button { 
            background: #007aff; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет с Айфона!</h1>
        <p>Это полноценное веб-приложение.</p>
        <button onclick="alert('Ура, работает!')">Нажми меня</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
